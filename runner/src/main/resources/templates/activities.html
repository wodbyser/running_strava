<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<th:block th:fragment="content">
    <div class="page-head">
        <div>
            <h1>Trainingen</h1>
            <p class="page-meta" th:text="${total} + ' trainingen gevonden'">0 trainingen</p>
        </div>
    </div>
    <form method="get" class="filter-bar" aria-label="Trainingen filteren">
        <input type="hidden" name="sort" th:value="${currentSort}">
        <input type="hidden" name="order" th:value="${currentOrder}">
        <div class="filter-row">
            <th:block th:replace="~{fragments :: periodFilter('Periode', ${filterPeriod}, ${filterFrom}, ${filterTill}, true)}"/>
            <span class="filter-group">
                <label for="type">Sport</label>
                <select name="type" id="type" data-autosubmit="true">
                    <option value="all" th:selected="${filterType == 'all' or filterType == ''}">Alle types</option>
                    <option value="run" th:selected="${filterType == 'run'}">Lopen</option>
                    <option value="ride" th:selected="${filterType == 'ride'}">Fietsen</option>
                    <option value="swim" th:selected="${filterType == 'swim'}">Zwemmen</option>
                    <option value="other" th:selected="${filterType == 'other'}">Overig</option>
                </select>
            </span>
            <span class="filter-divider" aria-hidden="true"></span>
            <fieldset class="filter-group">
                <legend class="field-label">Afstand (km)</legend>
                <span class="inline">
                    <input type="number" name="distanceMin" step="0.1" min="0" placeholder="Min" aria-label="Minimale afstand in km" th:value="${filterDistanceMin}" data-autosubmit="true">
                    <span class="unit" aria-hidden="true">tot</span>
                    <input type="number" name="distanceMax" step="0.1" min="0" placeholder="Max" aria-label="Maximale afstand in km" th:value="${filterDistanceMax}" data-autosubmit="true">
                </span>
            </fieldset>
            <fieldset class="filter-group">
                <legend class="field-label">Duur (min)</legend>
                <span class="inline">
                    <input type="number" name="durationMin" step="1" min="0" placeholder="Min" aria-label="Minimale duur in minuten" th:value="${filterDurationMin}" data-autosubmit="true">
                    <span class="unit" aria-hidden="true">tot</span>
                    <input type="number" name="durationMax" step="1" min="0" placeholder="Max" aria-label="Maximale duur in minuten" th:value="${filterDurationMax}" data-autosubmit="true">
                </span>
            </fieldset>
            <button type="submit" class="btn btn-primary btn-sm sr-only">Filter</button>
            <a href="?" class="btn btn-ghost btn-sm">Filters wissen</a>
        </div>
    </form>
    <section class="card" aria-labelledby="h-list">
        <h2 id="h-list" class="sr-only">Lijst van trainingen</h2>
        <div class="table-wrap table-stack table-stack--sortable">
        <table>
            <thead>
                <tr>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'date'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null"><a th:href="@{/activities(sort='date', order=(${currentSort == 'date' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'date'} ? 'sort-active' : ''" th:title="'Sorteer op datum'">Datum<span th:if="${currentSort == 'date'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'name'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null"><a th:href="@{/activities(sort='name', order=(${currentSort == 'name' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'name'} ? 'sort-active' : ''" th:title="'Sorteer op naam'">Naam<span th:if="${currentSort == 'name'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'type'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null"><a th:href="@{/activities(sort='type', order=(${currentSort == 'type' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'type'} ? 'sort-active' : ''" th:title="'Sorteer op type'">Type<span th:if="${currentSort == 'type'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'distance'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='distance', order=(${currentSort == 'distance' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'distance'} ? 'sort-active' : ''" th:title="'Sorteer op afstand'">Afstand<span th:if="${currentSort == 'distance'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'pace'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='pace', order=(${currentSort == 'pace' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'pace'} ? 'sort-active' : ''" th:title="'Sorteer op tempo'">Tempo<span th:if="${currentSort == 'pace'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'avgHr'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='avgHr', order=(${currentSort == 'avgHr' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'avgHr'} ? 'sort-active' : ''" th:title="'Sorteer op gemiddelde hartslag'">HR gem<span th:if="${currentSort == 'avgHr'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'maxHr'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='maxHr', order=(${currentSort == 'maxHr' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'maxHr'} ? 'sort-active' : ''" th:title="'Sorteer op maximale hartslag'">HR max<span th:if="${currentSort == 'maxHr'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'cadence'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='cadence', order=(${currentSort == 'cadence' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'cadence'} ? 'sort-active' : ''" th:title="'Sorteer op cadans'">Cadans (spm)<span th:if="${currentSort == 'cadence'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'elevation'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='elevation', order=(${currentSort == 'elevation' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'elevation'} ? 'sort-active' : ''" th:title="'Sorteer op elevatie'">Elevatie<span th:if="${currentSort == 'elevation'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'duration'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='duration', order=(${currentSort == 'duration' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'duration'} ? 'sort-active' : ''" th:title="'Sorteer op duur'">Duur<span th:if="${currentSort == 'duration'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                    <th scope="col" th:attr="aria-sort=${currentSort == 'sufferScore'} ? (${currentOrder == 'asc'} ? 'ascending' : 'descending') : null" class="num"><a th:href="@{/activities(sort='sufferScore', order=(${currentSort == 'sufferScore' and currentOrder == 'asc'} ? 'desc' : 'asc'), period=${filterPeriod}, from=${filterFrom}, till=${filterTill}, type=${filterType}, distanceMin=${filterDistanceMin}, distanceMax=${filterDistanceMax}, durationMin=${filterDurationMin}, durationMax=${filterDurationMax})}" class="sort-link" th:classappend="${currentSort == 'sufferScore'} ? 'sort-active' : ''" th:title="'Sorteer op suffer score'">Suffer<span th:if="${currentSort == 'sufferScore'}" th:text="${currentOrder == 'asc'} ? ' ▲' : ' ▼'"></span></a></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${activities}">
                    <td class="nowrap stack-meta" th:text="${a.date}">-</td>
                    <td class="stack-title"><a class="row-link" th:href="@{'/activity/' + ${a.id}}" th:text="${a.name}">-</a></td>
                    <td class="stack-meta"><span class="badge" th:classappend="'badge-' + ${a.typeClass}" th:text="${a.type}">-</span></td>
                    <td class="num" data-label="Afstand" th:text="${a.distance}">-</td>
                    <td class="num" data-label="Tempo" th:text="${a.pace}">-</td>
                    <td class="num" data-label="HR gem" th:text="${a.avgHr}">-</td>
                    <td class="num stack-hide" data-label="HR max" th:text="${a.maxHr ?: '-'}">-</td>
                    <td class="num stack-hide" data-label="Cadans" th:text="${a.cadence ?: '-'}">-</td>
                    <td class="num stack-hide" data-label="Elevatie" th:text="${a.elevation}">-</td>
                    <td class="num" data-label="Duur" th:text="${a.duration}">-</td>
                    <td class="num stack-hide" data-label="Suffer" th:text="${a.sufferScore ?: '-'}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(activities)}" class="table-empty">
                    <td colspan="11">Geen trainingen voor deze filters. <a href="?">Filters wissen</a></td>
                </tr>
            </tbody>
        </table>
        </div>
    </section>
</th:block>
</html>
