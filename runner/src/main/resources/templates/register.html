<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuw account - Running Coach</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta id="metaThemeColor" name="theme-color" content="#f2f4f5">
    <script th:src="@{/js/theme.js}" src="/js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<button class="theme-toggle theme-toggle--surface auth-theme" type="button" aria-pressed="false" aria-label="Schakel naar donker thema" title="Donker thema">
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 14.4A8.4 8.4 0 0 1 9.6 3.8 8.5 8.5 0 1 0 20.2 14.4Z"/></svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<main class="auth">
    <div class="auth-card auth-wide">
        <span class="auth-brand">
            <svg class="brand-mark" viewBox="0 0 30 20" fill="none" aria-hidden="true" focusable="false">
                <path d="M4.5 4.4 12.6 10l-8.1 5.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15.2 4.4 23.3 10l-8.1 5.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
            </svg>
            Running Coach
        </span>
        <h1>Nieuw account</h1>
        <p class="auth-sub">Je hebt een uitnodigingscode nodig. Je trainingen blijven helemaal van jou: niemand anders ziet ze.</p>
        <p class="msg bad" th:if="${error}" th:text="${error}">Fout</p>
        <form method="post" action="/register">
            <label for="code">Uitnodigingscode</label>
            <input id="code" name="code" type="password" autocomplete="off" required autofocus>
            <label for="username">Gebruikersnaam</label>
            <input id="username" name="username" type="text" autocomplete="username" th:value="${username}" pattern="[a-z][a-z0-9_]{2,30}" title="3 tot 31 tekens: kleine letters, cijfers of _, beginnend met een letter (geen spaties, punten of streepjes)" required>
            <p class="note-xs">3 tot 31 tekens: kleine letters, cijfers of _, beginnend met een letter. Geen spaties, punten of streepjes.</p>
            <label for="password">Wachtwoord</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <label for="password2">Wachtwoord nog eens</label>
            <input id="password2" name="password2" type="password" autocomplete="new-password" required>
            <button type="submit" class="btn btn-primary">Account maken</button>
        </form>
        <p class="auth-alt"><a href="/login">Ik heb al een account</a></p>
    </div>
</main>
</body>
</html>
