<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen - Running Coach</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#101b24">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="auth">
    <div class="auth-card">
        <span class="auth-brand">
            <svg class="brand-mark" viewBox="0 0 30 20" fill="none" aria-hidden="true" focusable="false">
                <path d="M4.5 4.4 12.6 10l-8.1 5.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15.2 4.4 23.3 10l-8.1 5.6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
            </svg>
            Running Coach
        </span>
        <h1>Inloggen</h1>
        <p class="auth-sub">Deze app is privé. Log in om je trainingen te bekijken.</p>
        <p class="msg bad" th:if="${param.error}">Gebruikersnaam of wachtwoord klopt niet.</p>
        <p class="msg ok" th:if="${param.logout}">Je bent uitgelogd.</p>
        <form method="post" action="/login">
            <label for="username">Gebruikersnaam</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Wachtwoord</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary">Inloggen</button>
        </form>
    </div>
</main>
</body>
</html>
