spring:
  application:
    name: running-coach

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/running}
    username: ${DB_USERNAME:postgres}
    # Local-only default matching docker-compose.yml; override with DB_PASSWORD in .env for anything else.
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  thymeleaf:
    cache: false

server:
  port: 8080

strava:
  client-id: ${STRAVA_CLIENT_ID:}
  client-secret: ${STRAVA_CLIENT_SECRET:}
  redirect-uri: http://localhost:8080/callback
  sync:
    cron: 0 0 6 * * *

logging:
  level:
    com.running: DEBUG
