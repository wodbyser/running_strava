spring:
  application:
    name: running-coach

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/running}
    username: ${DB_USERNAME:postgres}
    # Local-only default matching docker-compose.yml; override with DB_PASSWORD in .env for anything else.
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  thymeleaf:
    cache: false

  # Fixed locale so Thymeleaf #numbers uses the same decimal point as the rest of the app (not the browser locale).
  web:
    locale: en
    locale-resolver: fixed

server:
  port: 8080

strava:
  client-id: ${STRAVA_CLIENT_ID:}
  client-secret: ${STRAVA_CLIENT_SECRET:}
  redirect-uri: http://localhost:8080/callback
  sync:
    cron: 0 0 6 * * *

garmin:
  enabled: true
  api-key: ${GARMIN_PERSONAL_API_KEY:}
  base-url: ${GARMIN_PERSONAL_API_BASE_URL:https://personal.connectapi.garmin.com}
  store-raw-payloads: true
  timeout: 30s
  activity-page-size: 100
  sync:
    cron: 0 30 6 * * *
    overlap-days: 3
  backfill:
    default-days: 730
    chunk-days: 7
    pause: 2s
  retry:
    max-attempts: 3
    delays: 1s,4s

logging:
  level:
    com.running: DEBUG
